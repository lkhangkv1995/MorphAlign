[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "morphalign-coreg"
version = "0.2.0"
description = "Channel-agnostic exploration-guided affine and deformable image registration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "opencv-python>=4.7", "torch>=2.0", "scikit-image>=0.20", "tifffile>=2023.7", "matplotlib>=3.7"]
[project.optional-dependencies]
app = ["gradio>=5,<7"]
notebook = ["jupyterlab>=4", "ipywidgets>=8", "nbformat>=5"]
test = ["pytest>=7"]
[tool.setuptools.packages.find]
include = ["morphalign*"]
